name: Sync versions

on:
  schedule:
    # The one place to change the sync interval: hourly, off the hour.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      app:
        description: Only sync this app id
        required: false
        type: string

permissions: {}

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve app repositories to read
        id: repos
        run: pnpm exec tsx scripts/list-repos.ts --all >> "$GITHUB_OUTPUT"
      - name: Mint read-only token for the app repositories
        id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_READER_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repos.outputs.repos }}
          permission-contents: read
          permission-metadata: read
      - name: Sync versions
        env:
          GITHUB_TOKEN: ${{ steps.read-token.outputs.token }}
          APP: ${{ inputs.app }}
        run: |
          args=()
          if [ -n "$APP" ]; then args+=(--only "$APP"); fi
          pnpm sync "${args[@]}"
          cat .cache/sync-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- docs-versions.lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The PR is created with an App token on purpose: events caused by GITHUB_TOKEN
      # do not trigger pr.yml, so the required checks would never run.
      - name: Mint write token for this repository
        if: steps.diff.outputs.changed == 'true'
        id: write-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_READER_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read
      - name: Open or update the sync PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.write-token.outputs.token }}
          DOCS_SYNC_AUTO_MERGE: ${{ vars.DOCS_SYNC_AUTO_MERGE }}
        run: pnpm exec tsx scripts/sync-pr.ts
