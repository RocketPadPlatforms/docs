name: PR

# Required status checks: "checks" and "build". No path filters, so they always report.
on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fork-notice:
    # Fork PRs never reach the self-hosted runner or the App secrets.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "::notice::Pull requests from forks are not built (no access to the docs sources). A maintainer can push the branch to this repository to run the checks."

  checks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  fetch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve app repositories to read
        id: repos
        run: pnpm exec tsx scripts/list-repos.ts >> "$GITHUB_OUTPUT"
      - name: Mint read-only token
        if: steps.repos.outputs.repos != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_READER_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repos.outputs.repos }}
          permission-contents: read
          permission-metadata: read
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sources
          key: docs-sources-v1-${{ hashFiles('docs-versions.lock.json') }}
          restore-keys: docs-sources-v1-
      - name: Fetch locked docs
        env:
          DOCS_SOURCES_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm fetch:docs
      - run: mkdir -p .cache/sources && touch .cache/sources/.keep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-sources
          path: .cache/sources
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  build:
    needs: fetch
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-sources
          path: .cache/sources
      - run: pnpm prepare:docs
      - name: Environment variable names (this job has no secrets)
        run: env | cut -d= -f1 | sort
      - run: pnpm build
      - run: pnpm check:build
      - run: pnpm check:size
